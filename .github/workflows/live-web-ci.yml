name: Footmo Original Prediction Engine and Website Tests

on:
  pull_request:
    paths:
      - 'live-web/**'
      - '.github/workflows/live-web-ci.yml'
  push:
    branches: [master]
    paths:
      - 'live-web/**'
      - '.github/workflows/live-web-ci.yml'

permissions:
  contents: read

jobs:
  original-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: live-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without production bootstrap
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test original forecasting, forecast history, provider and website
        run: npm test
      - name: Verify original app and API entry points
        run: |
          test -f index.html
          test -f analysis.html
          test -f lib/model.js
          test -f api/state.js
          node --check picks.js
          node --check app.js
          node --check api/state.js
          node --check api/refresh.js
          node --check lib/state.js
