name: Recover original Footmo source tree

on:
  push:
    branches: [restore/original-footmo-20261112]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify exact original live-web tree and current tree
        run: |
          set -euo pipefail
          git fetch origin 46701ad356d3c811b1172f6c668696ce1a809c39
          echo "RECOVERY_BASE_TREE=$(git rev-parse HEAD^{tree})"
          echo "ORIGINAL_LIVE_WEB_TREE=$(git rev-parse 46701ad356d3c811b1172f6c668696ce1a809c39:live-web)"
          git restore --source=46701ad356d3c811b1172f6c668696ce1a809c39 --staged --worktree -- live-web
          git diff --cached --stat
      - name: Test original engine without touching live records
        working-directory: live-web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
