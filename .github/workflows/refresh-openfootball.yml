name: Refresh OpenFootball match data

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openfootball-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public-domain source license and pinned datasets
        working-directory: live-web
        run: node scripts/refresh-openfootball.mjs
      - name: Test and build verified match data
        working-directory: live-web
        run: |
          npm test
          npm run build
      - name: Update only the four open-source snapshots when data changes
        run: |
          set -euo pipefail
          git add live-web/data/en.json live-web/data/es.json live-web/data/it.json live-web/data/de.json
          if git diff --cached --quiet; then
            echo "No new source data; previous estimates remain dated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh CC0 OpenFootball match snapshots"
          git push origin HEAD:master
