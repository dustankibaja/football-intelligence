name: Prospective 63-Fixture Result Reconciliation (Research Only)

on:
  pull_request:
    paths:
      - '.github/workflows/prospective-results-reconciliation.yml'
      - 'backend/app/research/football_data_result_verifier.py'
      - 'backend/app/research/prospective_reconciliation.py'
      - 'backend/tests/unit/test_independent_result_verifier.py'
      - 'backend/tests/unit/test_prospective_reconciliation.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/prospective-results-reconciliation.yml'
  schedule:
    - cron: '15 5 * 11,12,1 *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: football-prospective-read-only-result-audit
  cancel-in-progress: false

jobs:
  reconcile-real-football-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Verify date-only result and immutability guards
        working-directory: backend
        run: |
          pytest -q tests/unit/test_prospective_reconciliation.py tests/unit/test_independent_result_verifier.py

      - name: Determine research result observation window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, UTC, date
          today = datetime.now(UTC).date()
          print(f"active={'true' if date(2026, 11, 21) <= today <= date(2027, 1, 16) else 'false'}")
          PY

      - name: Download original independently issued 63-forecast ledger
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research_outputs/original
          if ! gh run download 42615434488 --repo "$GITHUB_REPOSITORY" --name football-prospective-shadow-evidence --dir research_outputs/original; then
            echo "Original 30-day GitHub artifact unavailable; checking archived byte-identical master copy"
            ARCHIVE_RUN_ID="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=football-prospective-verified-original-ledger" --jq '[.artifacts[] | select(.name == "football-prospective-verified-original-ledger" and (.expired | not) and .workflow_run.head_branch == "master")] | sort_by(.created_at) | last | .workflow_run.id // empty')"
            if [ -z "$ARCHIVE_RUN_ID" ]; then
              echo "ERROR: No verified original ledger archive; refusing to reconstruct past forecasts"
              exit 1
            fi
            gh run download "$ARCHIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name football-prospective-verified-original-ledger --dir research_outputs/original
          fi

      - name: Verify original issuance and binary SHA-256
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p = Path("research_outputs/original/prospective_shadow_2026_27.json")
          raw = p.read_bytes()
          expected_bytes_sha = "b4969b39b87768967352672234b399a0144d94262d3674b9004f2fc6346774c9"
          if hashlib.sha256(raw).hexdigest() != expected_bytes_sha:
              raise SystemExit("Original issued ledger byte fingerprint mismatch")
          data = json.loads(raw)
          unsigned = dict(data)
          original_sha = unsigned.pop("ledger_sha256")
          expected_ledger_sha = "a04e7d71389c0e18bae2aa2bbb21285f5de3d4d98874a51ff9559fd1e9de3412"
          if hashlib.sha256(json.dumps(unsigned, sort_keys=True).encode()).hexdigest() != original_sha or original_sha != expected_ledger_sha:
              raise SystemExit("Original prospective ledger integrity mismatch")
          if data["counts"]["forecasts_issued"] != 63 or len(data["predictions"]) != 63:
              raise SystemExit("Expected exact original 63 independently issued forecasts")
          if data["model"]["publication_eligible"] is not False:
              raise SystemExit("Research model must remain non-publication")
          print("Original November 9 research ledger verified (63 forecasts, immutable SHA-256)")
          PY

      - name: Renew verified original evidence archive (never retrain or reissue)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: football-prospective-verified-original-ledger
          path: research_outputs/original/prospective_shadow_2026_27.json
          retention-days: 90
          if-no-files-found: error

      - name: Obtain independent official current-season results
        if: github.event_name != 'pull_request' && steps.window.outputs.active == 'true'
        working-directory: backend
        run: |
          python -m app.research.football_data_result_verifier \
            --original-ledger ../research_outputs/original/prospective_shadow_2026_27.json \
            --output ../research_outputs/prospective_63_real_result_audit.json

      - name: Verify independent metrics refer to original 63 forecasts
        if: github.event_name != 'pull_request' && steps.window.outputs.active == 'true'
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("research_outputs/prospective_63_real_result_audit.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data["original_forecasts"] != 63:
              raise SystemExit("Original forecast count mismatch")
          if data["original_forecast_ledger_sha256"] != "a04e7d71389c0e18bae2aa2bbb21285f5de3d4d98874a51ff9559fd1e9de3412":
              raise SystemExit("Wrong original forecast lineage")
          if data["finished_evaluated"] + data["pending_or_unverified"] != 63:
              raise SystemExit("Duplicate or omitted prospective fixtures")
          signature = data.pop("report_sha256")
          if hashlib.sha256(json.dumps(data, sort_keys=True).encode()).hexdigest() != signature:
              raise SystemExit("Prospective result report digest mismatch")
          print(f"VERIFIED: {data['finished_evaluated']} scored, {data['pending_or_unverified']} still pending/unverified")
          PY

      - name: Archive read-only result assessment (no raw provider CSVs)
        if: github.event_name != 'pull_request' && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: football-prospective-63-result-assessment
          path: research_outputs/prospective_63_real_result_audit.json
          retention-days: 90
          if-no-files-found: error
