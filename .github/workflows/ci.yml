name: Football Intelligence System CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest PR revision under test; older commits cannot certify
# the current branch and would waste CI minutes during rapid development.
concurrency:
  group: footmo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-smoke:
    name: Footmo Frontend Syntax and Asset Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and required files
        run: |
          node --check frontend/app.js
          node --check live-web/app.js
          for file in live-web/api/*.js live-web/lib/*.js; do node --check "$file"; done
          node --test live-web/tests/model.test.js
          test -s live-web/index.html
          test -s live-web/styles.css
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/README.md
      - name: Validate private staging Compose topology
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          CUSTOMER_API_TOKEN: ci-test-only
          LIVE_DATA_API_KEY: ci-placeholder-not-a-live-provider-key
        run: docker compose -f infrastructure/compose.staging.yml config -q
      - name: Check Python compilation and new-code fatal errors
        run: |
          python -m compileall -q backend/app
          python -m pip install ruff
          ruff check backend/app/prediction/frozen_inference.py backend/app/features/live.py backend/app/api/v1/security.py backend/app/api/v1/endpoints backend/app/automation/worker.py backend/app/evaluation/summary.py --select E9,F63,F7,F82

  lint-policy:
    name: Codebase Lint Policy (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Report Ruff Lint Statistics
        continue-on-error: true
        run: |
          ruff check backend/app backend/tests --statistics

  postgresql-certification:
    name: PostgreSQL Clean-Chain Migration & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Verify Toolchain & PostgreSQL Service Version
        env:
          PGPASSWORD: postgres
        run: |
          python --version
          alembic --version
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d football_intelligence_test -c "SELECT version();"

      - name: Verify Clean Database Precondition (Zero Tables)
        env:
          PGPASSWORD: postgres
        run: |
          TABLE_COUNT=$(psql -h localhost -p 5432 -U postgres -d football_intelligence_test -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Initial public table count: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -ne "0" ]; then
            echo "ERROR: Clean database expected 0 public tables, found $TABLE_COUNT"
            exit 1
          fi

      - name: Run Alembic Offline SQL Migration Generation
        run: |
          cd backend
          alembic upgrade head --sql > offline_migrations.sql
          grep "CREATE TABLE" offline_migrations.sql | head -n 5

      - name: Execute Clean-Chain Alembic Migrations to Head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        run: |
          cd backend
          alembic upgrade head

      - name: Verify Alembic Migration Head
        env:
          PGPASSWORD: postgres
        run: |
          DB_HEAD=$(psql -h localhost -p 5432 -U postgres -d football_intelligence_test -t -A -c "SELECT version_num FROM alembic_version;")
          echo "Database Alembic revision: $DB_HEAD"
          if [ "$DB_HEAD" != "20261105_0007" ]; then
            echo "ERROR: Database revision ($DB_HEAD) does not match expected repository head (20261023_0006)"
            exit 1
          fi

      - name: Run Targeted PostgreSQL Integration Tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -m integration -v

      - name: Run Full Repository Regression Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -v
