name: Football Intelligence System CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-policy:
    name: Advisory Ruff Lint Statistics (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Report Ruff Lint Statistics
        continue-on-error: true
        run: |
          ruff check backend/app backend/tests --statistics

  postgresql-certification:
    name: PostgreSQL Clean-Chain Migration & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Verify Toolchain & PostgreSQL Service Version
        env:
          PGPASSWORD: postgres
        run: |
          python --version
          alembic --version
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d football_intelligence_test -c "SELECT version();"

      - name: Verify Clean Database Precondition (Zero Tables)
        env:
          PGPASSWORD: postgres
        run: |
          TABLE_COUNT=$(psql -h localhost -p 5432 -U postgres -d football_intelligence_test -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
          echo "Initial public table count: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -ne "0" ]; then
            echo "ERROR: Clean database expected 0 public tables, found $TABLE_COUNT"
            exit 1
          fi

      - name: Run Alembic Offline SQL Migration Generation
        run: |
          cd backend
          alembic upgrade head --sql > offline_migrations.sql
          grep -m 5 "CREATE TABLE" offline_migrations.sql

      - name: Execute Clean-Chain Alembic Migrations to Head
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        run: |
          cd backend
          alembic upgrade head

      - name: Verify Alembic Migration Head Against Repository
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
        run: |
          cd backend
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from app.core.config import settings

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one repository migration head, found: {heads}")

          engine = create_engine(settings.database_url)
          try:
              if engine.dialect.name != "postgresql":
                  raise SystemExit("Migration head verification must use PostgreSQL")
              with engine.connect() as connection:
                  actual_head = connection.execute(
                      text("SELECT version_num FROM alembic_version")
                  ).scalar_one()
                  current_db = connection.execute(text("SELECT current_database()")).scalar_one()
          finally:
              engine.dispose()

          if current_db != "football_intelligence_test":
              raise SystemExit("CI connected to an unexpected database")
          if actual_head != heads[0]:
              raise SystemExit(f"Database head {actual_head} != repository head {heads[0]}")
          print(f"Verified clean PostgreSQL migration at head {actual_head}")
          PY

      - name: Run Targeted PostgreSQL Integration Tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -m integration -v

      - name: Run Full Repository Regression Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_intelligence_test
          RUNNING_IN_CI: "true"
        run: |
          cd backend
          pytest -v
