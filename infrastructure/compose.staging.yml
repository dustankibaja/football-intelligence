# Private staging topology. TLS reverse proxy, offsite backups and host
# monitoring are required before a public production launch.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-football_intelligence}
    volumes:
      - footmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-football_intelligence}
      CUSTOMER_API_TOKEN: ${CUSTOMER_API_TOKEN:?Set a staging access token}
      CUSTOMER_ALLOWED_ORIGINS: ${CUSTOMER_ALLOWED_ORIGINS:-http://localhost:5173}
      LIVE_DATA_API_KEY: ${LIVE_DATA_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:5173:80"
    networks: [internal]

volumes:
  footmo_pgdata:

networks:
  internal:
    driver: bridge
