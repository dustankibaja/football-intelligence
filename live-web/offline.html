<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <title>Footmo · Offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;
      background:#071321;color:#eef5f9;font-family:system-ui,-apple-system,sans-serif}
    main{max-width:380px;text-align:center}
    .mark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 25px;
      border-radius:21px;background:#c4f65e;color:#071321;font-size:46px;font-weight:900}
    h1{font-size:28px;letter-spacing:-.04em}p{color:#a4b8c6;line-height:1.65}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
      margin-top:18px;padding:0 24px;background:#c4f65e;border-radius:12px;
      color:#071321;text-decoration:none;font-weight:800}
  </style>
</head>
<body><main>
  <div class="mark" aria-hidden="true">F</div>
  <h1>You're offline</h1>
  <p>Footmo needs an internet connection to show verified fixtures, forecasts, and results. We don't display stale predictions as live data.</p>
  <a href="/">Try again</a>
</main></body>
</html>
